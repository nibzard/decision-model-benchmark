[project]
name = "dmb"
version = "0.1.0"
description = "DMB - Decision-model benchmark: jev vs constrained LLMs vs deterministic baselines"
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.scripts]
dmb = "dmb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
